plugins { id 'com.android.application' }
def targetAbis = (project.findProperty('prometheusAbis') ?: 'arm64-v8a').toString().split(',')
android {
    namespace 'ai.prometheus.android'
    compileSdk 35
    ndkVersion "27.2.12479018"
    defaultConfig {
        applicationId 'ai.prometheus.offline.chat'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters.addAll(targetAbis.toList()) }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        externalNativeBuild { cmake {
            cppFlags '-std=c++17 -fexceptions'
            arguments '-DCMAKE_BUILD_TYPE=Release', '-DANDROID_STL=c++_static', '-DGGML_NATIVE=OFF', '-DGGML_OPENMP=OFF',
                '-DGGML_LLAMAFILE=OFF', '-DLLAMA_OPENSSL=OFF', '-DGGML_VULKAN=OFF',
                '-DGGML_AVX=OFF', '-DGGML_AVX2=OFF', '-DGGML_FMA=OFF', '-DGGML_F16C=OFF', '-DGGML_BMI2=OFF'
            targets 'prometheus'
        } }

    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    signingConfigs {
        if (System.getenv('PROMETHEUS_KEYSTORE')) {
            prometheus {
                storeFile file(System.getenv('PROMETHEUS_KEYSTORE'))
                storePassword System.getenv('PROMETHEUS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PROMETHEUS_KEY_ALIAS')
                keyPassword System.getenv('PROMETHEUS_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('PROMETHEUS_KEYSTORE')) signingConfig signingConfigs.prometheus
        }
    }
}
dependencies {
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
