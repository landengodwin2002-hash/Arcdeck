plugins { id 'com.android.application' }
android {
    namespace 'ai.prometheus.android'
    compileSdk 35
    ndkVersion "27.2.12479018"
    defaultConfig {
        applicationId 'ai.prometheus.offline'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0-native-preview'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -O2 -fexceptions'; arguments '-DGGML_NATIVE=OFF', '-DGGML_OPENMP=OFF', '-DGGML_LLAMAFILE=OFF', '-DLLAMA_OPENSSL=OFF', '-DGGML_VULKAN=OFF', '-DLLAMA_BUILD_EXAMPLES=OFF', '-DLLAMA_BUILD_TESTS=OFF', '-DLLAMA_BUILD_SERVER=OFF' } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'com.tom-roush:pdfbox-android:2.0.27.0' }
