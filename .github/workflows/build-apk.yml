name: Build ArcDeck APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arcdeck-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    name: Build ${{ matrix.flavor }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: full
            task: assembleFullDebug
          - flavor: lite
            task: assembleLiteDebug
    steps:
      - name: Checkout ArcDeck
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: arcdeck
          persist-credentials: false
      - name: Checkout pinned PlayFieldPortal source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: JohnnyCollado/PlayFieldPortal
          ref: 5ee271ea9545685417aecdd13b5ace033cdb7806
          path: upstream
          lfs: ${{ matrix.flavor == 'full' }}
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Check installer and search contracts
        working-directory: arcdeck
        run: |
          python3 test_installer.py
          python3 tests/test_search_sql.py
      - name: Apply workspace and build identity
        run: python3 arcdeck/scripts/prepare_build.py upstream --build-number "$GITHUB_RUN_NUMBER"
      - name: Install Android SDK
        run: |
          sdkmanager --install 'platforms;android-37.0' 'build-tools;37.0.0'
          if [ '${{ matrix.flavor }}' = 'full' ]; then
            sdkmanager --install 'ndk;27.0.12077973' 'cmake;3.22.1'
          fi
      - name: Verify Full SDK bytes
        if: matrix.flavor == 'full'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import is_zipfile
          for name in ('discord_partner_sdk.aar', 'discord_partner_sdk_krisp.aar'):
              path = Path('upstream/discord/discord-native/libs') / name
              if not is_zipfile(path):
                  raise SystemExit(f'Missing Git LFS SDK bytes: {path}')
          PY
      - name: Compile installable APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :app:${{ matrix.task }} --no-daemon --stacktrace --max-workers=2
      - name: Collect APK and provenance
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          flavor = os.environ['FLAVOR']
          apks = list(Path(f'upstream/app/build/outputs/apk/{flavor}/debug').glob('*.apk'))
          if len(apks) != 1:
              raise SystemExit(f'Expected one APK, got {apks}')
          out = Path('dist')
          out.mkdir()
          apk = out / f'ArcDeck-Workspace-{flavor}-debug.apk'
          shutil.copy2(apks[0], apk)
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          (out / 'SHA256SUMS.txt').write_text(f'{digest}  {apk.name}\n')
          (out / 'build-info.json').write_text(json.dumps({
              'arcdeck_commit': os.environ['GITHUB_SHA'],
              'upstream_commit': '5ee271ea9545685417aecdd13b5ace033cdb7806',
              'flavor': flavor, 'build_number': os.environ['GITHUB_RUN_NUMBER'],
              'sha256': digest, 'signing': 'Android debug key', 'device_tested': False
          }, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'### ArcDeck {flavor} APK built\n\nDownload the **ArcDeck-Workspace-{flavor}-debug** artifact below, extract the APK and install it on Android 10+. Physical-device testing is pending.\n')
          PY
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ArcDeck-Workspace-${{ matrix.flavor }}-debug
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ArcDeck-diagnostics-${{ matrix.flavor }}
          path: |
            upstream/**/build/reports/
            upstream/**/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
