name: Prometheus Nova offline conversation
on:
  push:
    branches: [prometheus-native-app, prometheus/offline-chat]
    paths: ['prometheus/**', '.github/workflows/prometheus-native-android.yml']
  pull_request:
    branches: [main, prometheus-native-app]
    paths: ['prometheus/**', '.github/workflows/prometheus-native-android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prometheus-nova-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Build and exercise real offline conversation
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install pinned native toolchain
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Fetch unmodified pinned llama.cpp
        run: python3 prometheus/scripts/fetch_runtime.py
      - name: Build the same app for phone and emulator; verify stream framing
        working-directory: prometheus
        run: gradle --no-daemon --max-workers=3 :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - name: Fetch the exact existing 4B abliterated GGUF for runtime tests
        run: |
          mkdir -p "$RUNNER_TEMP/prometheus-model"
          curl --fail --location --retry 3 'https://huggingface.co/mradermacher/Huihui-Qwen3.5-4B-abliterated-GGUF/resolve/main/Huihui-Qwen3.5-4B-abliterated.Q4_K_M.gguf?download=true' -o "$RUNNER_TEMP/prometheus-model/existing-4b-abliterated.gguf"
          echo "423f10b6ec2d99c3378143d7cd3b80eb4887b3ed92103103ac59173b404f4f7c  $RUNNER_TEMP/prometheus-model/existing-4b-abliterated.gguf" | sha256sum -c -
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test streamed answers, Home, screen recreation, history and Stop without internet
        uses: reactivecircus/android-emulator-runner@v2
        env:
          PROMETHEUS_TEST_MODEL: ${{ runner.temp }}/prometheus-model/existing-4b-abliterated.gguf
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash prometheus/scripts/android_acceptance.sh
      - name: Save runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Prometheus-Nova-validation
          path: |
            prometheus/test-results/
            prometheus/app/build/reports/tests/
            prometheus/app/build/reports/lint-results-debug.html
          if-no-files-found: warn
      - name: Prepare original Nova signing key if available
        id: signing
        env:
          NOVA_KEY: ${{ secrets.PROMETHEUS_SIGNING_KEY_B64 }}
        run: |
          if [ -z "$NOVA_KEY" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Phone release blocked: original Nova signing key is absent. Runtime checks are independent of this release gate.' >> "$GITHUB_STEP_SUMMARY"
          else
            umask 077
            printf '%s' "$NOVA_KEY" | base64 --decode > "$RUNNER_TEMP/nova.jks"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and verify the single phone update APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: prometheus
        env:
          PROMETHEUS_KEYSTORE: ${{ runner.temp }}/nova.jks
          PROMETHEUS_KEYSTORE_PASSWORD: ${{ secrets.PROMETHEUS_KEYSTORE_PASSWORD }}
          PROMETHEUS_KEY_ALIAS: ${{ secrets.PROMETHEUS_KEY_ALIAS }}
          PROMETHEUS_KEY_PASSWORD: ${{ secrets.PROMETHEUS_KEY_PASSWORD }}
        run: |
          gradle --no-daemon --max-workers=3 :app:assembleRelease
          python3 scripts/check_signing.py --apk app/build/outputs/apk/release/app-release.apk --apksigner "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          cp app/build/outputs/apk/release/app-release.apk Prometheus-Nova.apk
      - name: Publish only the compatible phone update
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Prometheus-Nova
          path: prometheus/Prometheus-Nova.apk
          if-no-files-found: error
