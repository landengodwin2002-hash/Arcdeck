name: Build Prometheus v0.3 APK
on:
  push:
    branches: [prometheus/library-v03]
    paths: [prometheus/v03_payload.b64, .github/workflows/prometheus-v03.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Unpack and verify Prometheus source
        run: |
          base64 --decode prometheus/v03_payload.b64 > source.tar.gz
          echo "b50b32b2fc35d3379437735c01c5517e529af38dee3dffa2e7e25fd947280186  source.tar.gz" | sha256sum --check
          tar -xzf source.tar.gz
      - name: Assemble APK
        run: gradle -p Prometheus :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Prometheus-v0.3-APK
          path: Prometheus/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
