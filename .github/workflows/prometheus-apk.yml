name: Build Prometheus v0.2 APK
on:
  push:
    branches: [prometheus/android-v1]
    paths:
      - 'prometheus/v02_payload.txt'
      - '.github/workflows/prometheus-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0' || true
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Extract and verify Prometheus source
        run: |
          base64 --decode prometheus/v02_payload.txt > prometheus-v02.tar.gz
          echo "70aa93747928162b0b86477f4f5f1fc2bd277ad2f17d819bf443aae2ad6b2d30  prometheus-v02.tar.gz" | sha256sum --check
          tar -xzf prometheus-v02.tar.gz
          test -f Prometheus/app/src/main/java/ai/prometheus/android/MainActivity.java
      - name: Build APK
        run: gradle -p Prometheus :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Prometheus-v0.2-Android-APK
          path: Prometheus/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
